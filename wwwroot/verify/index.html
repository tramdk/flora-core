<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraCore - Self-Verification Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/verify/dashboard.css">
</head>
<body>
    <div class="container" data-verify-dashboard="active" data-verify-overall-status="loading">
        <div class="ambient-glow-1"></div>
        <header>
            <div class="logo-section">
                <h1>FloraCore</h1>
                <p>Self-Verification Control Center (Môi trường cục bộ)</p>
            </div>
            <button id="btnRunVerify" class="btn-reload">
                <span class="btn-icon">⚡</span>
                <span class="btn-text">Khởi chạy tự kiểm thử</span>
            </button>
        </header>

        <!-- Banner Trạng thái -->
        <div id="statusBanner" class="banner status-running">
            <div class="banner-icon">⏳</div>
            <div class="banner-info">
                <h2 id="statusBannerTitle">Đang tải dữ liệu...</h2>
                <p id="statusBannerDesc">Đang kết nối tới máy chủ tự kiểm thử để lấy kết quả xác thực ban đầu.</p>
            </div>
        </div>

        <!-- Thống kê -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Tổng số Component</span>
                <span id="statTotal" class="stat-value" data-verify-total="0">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Đã vượt qua</span>
                <span id="statPassed" class="stat-value success" data-verify-passed="0">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Bị thất bại</span>
                <span id="statFailed" class="stat-value failed" data-verify-failed="0">—</span>
            </div>
        </div>

        <!-- Danh sách chi tiết -->
        <div>
            <div class="section-header">
                <h2 class="section-title">Chi tiết các thành phần kiểm thử</h2>
            </div>
            <div id="componentList" class="component-list">
                <!-- Rendered by dashboard.js -->
            </div>
        </div>
    </div>

    <script src="/verify/dashboard.js"></script>
</body>
</html>
